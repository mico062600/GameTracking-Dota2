name: Check Dota 2 Matches

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs automatically every 10 minutes
  workflow_dispatch:        # Allows you to trigger it manually

jobs:
  check-match:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Allows GitHub to save the match ID to your repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tracker.py

      - name: Commit and Push Cache Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add last_match_*.txt || true
          git commit -m "Update match cache [skip ci]" || true
          git push || true
